name: logbook
description: "Pilot Flight Tracker - Track and replay flights in 3D"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  geolocator: ^14.0.2
  shared_preferences: ^2.3.4
  uuid: ^4.5.1
  intl: ^0.20.2
  latlong2: ^0.9.1
  flutter_map: ^8.3.0
  fl_chart: ^1.2.0
  google_fonts: ^8.1.0
  http: ^1.2.0
  path_provider: ^2.1.0
  hive_flutter: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/models/
