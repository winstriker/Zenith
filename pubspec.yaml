name: logbook
description: "Pilot Flight Tracker - Track and replay flights in 3D"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.4
  uuid: ^4.5.1
  intl: ^0.19.0
  latlong2: ^0.9.1
  flutter_map: ^7.0.2
  fl_chart: ^0.69.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
