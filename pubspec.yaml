name: zenith
description: "Zenith - Pilot's Logbook"
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.3.1
  geolocator: ^14.0.2
  shared_preferences: ^2.3.4
  uuid: ^4.5.1
  intl: ^0.20.2
  latlong2: ^0.10.1
  flutter_map: ^8.3.0
  flutter_map_vector_tiles: ^2.8.1
  fl_chart: ^1.2.0
  google_fonts: ^9.0.0
  http: ^1.2.0
  path_provider: ^2.1.5
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  flutter_native_html_to_pdf: ^3.1.0
  country_flags: ^4.1.1
  timezone: ^0.11.1
  state_notifier: ^1.0.0
  lat_lng_to_timezone: ^0.2.0
  logging: ^1.3.0
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.7
  package_info_plus: ^10.2.2
  app_links: ^7.2.1
  url_launcher: ^6.3.3
dependency_overrides:
  flutter_map_vector_tiles:
    path: packages/flutter_map_vector_tiles

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  drift_dev: ^2.33.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
