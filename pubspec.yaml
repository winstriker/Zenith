name: logbook
description: "Pilot Flight Tracker - Track and replay flights in 3D"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  geolocator: ^14.0.2
  shared_preferences: ^2.3.4
  uuid: ^4.5.1
  intl: ^0.20.2
  latlong2: ^0.9.1
  flutter_map: ^8.3.0
  flutter_map_vector_tiles: ^2.8.1
  fl_chart: ^1.2.0
  google_fonts: ^8.1.0
  http: ^1.2.0
  path_provider: ^2.1.5
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  flutter_native_html_to_pdf: ^3.1.0
  share_plus: ^10.1.4
  country_flags: ^4.1.1
  timezone: ^0.11.1
  state_notifier: ^1.0.0
  lat_lng_to_timezone: ^0.2.0
dependency_overrides:
  flutter_map_vector_tiles:
    path: packages/flutter_map_vector_tiles

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  drift_dev: ^2.33.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
