name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    # Only a head commit saying [BUILD RELEASE], pushed by the repository owner.
    if: >-
      contains(github.event.head_commit.message, '[BUILD RELEASE]') &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: Build Release
    permissions:
      contents: write
    env:
      # Same Flutter (main channel) the app is developed with.
      FLUTTER_REF: 7ddb90b4c7
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and tags, for the changelog.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub drops caches unused for 7 days; the build then downloads it all.
      - name: Cache Flutter
        id: flutter
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/flutter
          key: flutter-${{ runner.os }}-${{ env.FLUTTER_REF }}

      - name: Cache pub and Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: deps-${{ runner.os }}-${{ env.FLUTTER_REF }}-${{ hashFiles('pubspec.lock', 'android/**/*.gradle.kts', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: deps-${{ runner.os }}-${{ env.FLUTTER_REF }}-

      - name: Install Flutter
        if: steps.flutter.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" checkout "$FLUTTER_REF"

      - name: Add Flutter to PATH
        run: echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Fail now rather than at the end of the build.
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty or not set in the Build Release environment"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          keytool -list -keystore android/app/upload-keystore.jks \
            -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS"
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      # The run number is the build number (Android version code), so every
      # release is newer than the last one, which the in-app updater relies on.
      # One universal APK (see splits in android/app/build.gradle.kts), plus a
      # smaller one per architecture, all from a single build.
      - name: Build APKs
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          ICAO_TYPES_URL: ${{ secrets.ICAO_TYPES_URL }}
          UPDATES_REPO_URL: ${{ secrets.UPDATES_REPO_URL }}
          ANNOUNCEMENTS_URL: ${{ secrets.ANNOUNCEMENTS_URL }}
          PRIVACY_POLICY_URL: ${{ secrets.PRIVACY_POLICY_URL }}
          TERMS_OF_SERVICE_URL: ${{ secrets.TERMS_OF_SERVICE_URL }}
        run: |
          flutter pub get
          build=(
            flutter build apk --release --flavor prod
            --build-number=${{ github.run_number }}
            --dart-define=DROPBOX_APP_KEY="$DROPBOX_APP_KEY"
            --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"
            --dart-define=ICAO_TYPES_URL="$ICAO_TYPES_URL"
            --dart-define=UPDATES_REPO_URL="$UPDATES_REPO_URL"
            --dart-define=ANNOUNCEMENTS_URL="$ANNOUNCEMENTS_URL"
            --dart-define=PRIVACY_POLICY_URL="$PRIVACY_POLICY_URL"
            --dart-define=TERMS_OF_SERVICE_URL="$TERMS_OF_SERVICE_URL"
          )
          out=build/app/outputs/flutter-apk
          mkdir apks
          "${build[@]}" --split-per-abi
          cp "$out/app-prod-release.apk" apks/universal.apk
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "$out/app-$abi-prod-release.apk" "apks/$abi.apk"
          done

      # Tagged v<pubspec version name>+<build number>, as the updater expects.
      # Titled after the commit's first line (minus the marker); described by
      # the commits since the previous release, if there is one. The updater
      # picks its APK by the architecture at the end of the file name.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)+${{ github.run_number }}"
          title="$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1 | sed 's/\[BUILD RELEASE\]//g; s/^ *//; s/ *$//')"
          previous="$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')"
          : > notes.md
          if [ -n "$previous" ]; then
            git log --no-merges --invert-grep -F --grep='[BUILD RELEASE]' \
              --format='- %s' "$previous..HEAD" > notes.md
          fi
          for apk in apks/*.apk; do
            mv "$apk" "apks/zenith-$version-$(basename "$apk")"
          done
          # GitHub sometimes answers with a 5xx; retry instead of rebuilding.
          for wait in 15 30 60 120 0; do
            gh release create "v$version" apks/*.apk \
              --title "${title:-Zenith $version}" --notes-file notes.md --target "$GITHUB_SHA" && exit 0
            sleep "$wait"
          done
          exit 1
